# Netlify configuration for the Forest Apothecary app.
# Kept minimal so it doesn't override existing build settings — only declares
# the scheduled function. Functions live in the default dir (netlify/functions).

# Run the SMS reminder sender every 15 minutes.
[functions."send-reminders"]
  schedule = "*/15 * * * *"

# Keep internal files off the public site.
#
# Netlify publishes this repository from its root, so every committed file is
# servable. A plain redirect is NOT enough: Netlify serves an existing static
# file before it consults the redirect table, so the first attempt at this
# (a _redirects file, Sep 21 2026) deployed and did nothing. /specs/index.html,
# /CLAUDE.md and /supabase-schema.sql all still returned 200.
#
# force = true is what makes the rule win over the file on disk. Verified after
# deploy, not assumed, because the last version of this was also believed to
# work.
[[redirects]]
  from = "/specs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase-schema.sql"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
